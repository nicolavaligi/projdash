[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "projdash"
version = "0.1.0"
description = "A terminal dashboard for people juggling many small projects, backed by one hand-editable TSV file."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nicola Valigi" }]
keywords = ["cli", "dashboard", "projects", "tsv", "productivity"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nicolavaligi/projdash"
Issues = "https://github.com/nicolavaligi/projdash/issues"

[project.scripts]
projdash = "projdash:main"

[tool.setuptools]
py-modules = ["projdash"]
